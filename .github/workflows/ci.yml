name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: every job only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.17.1"
  TFLINT_VERSION: "v0.66.0"
  HELM_VERSION: "v4.3.1"
  PYTHON_VERSION: "3.12"
  CHECKOV_VERSION: "3.4.3"
  YAMLLINT_VERSION: "1.38.0"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  terraform:
    name: terraform (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: layer1-persistent
            dir: terraform/layer1-persistent
          - name: layer1-bootstrap
            dir: terraform/layer1-persistent/bootstrap
          # layer2 reads gitops/ manifests via ${path.root}/../../gitops, so it
          # must be validated from a full checkout of the repository layout.
          - name: layer2-ephemeral
            dir: terraform/layer2-ephemeral
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
        working-directory: ${{ matrix.dir }}
      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false -lockfile=readonly
        working-directory: ${{ matrix.dir }}
      - name: terraform validate
        run: terraform validate -no-color
        working-directory: ${{ matrix.dir }}

  tflint:
    name: tflint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: tflint --init
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: tflint
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  checkov:
    name: checkov
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install checkov
        run: pip install --no-cache-dir "checkov==${CHECKOV_VERSION}"
      - name: checkov
        run: checkov -d terraform --config-file .checkov.yaml --framework terraform --compact --quiet

  helm:
    name: helm (${{ matrix.chart }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - chart: qwen-api
            values: gitops/envs/dev/qwen-values.yaml
          - chart: open-webui
            values: gitops/envs/dev/open-webui-values.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: helm lint (chart defaults)
        run: helm lint "gitops/charts/${{ matrix.chart }}"
      - name: helm lint (dev values)
        run: helm lint "gitops/charts/${{ matrix.chart }}" -f "${{ matrix.values }}"
      - name: helm template (dev values)
        run: helm template ci "gitops/charts/${{ matrix.chart }}" -f "${{ matrix.values }}" > /dev/null

  yamllint:
    name: yamllint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install yamllint
        run: pip install --no-cache-dir "yamllint==${YAMLLINT_VERSION}"
      - name: yamllint
        run: yamllint --strict -f github .

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  links:
    name: links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Offline mode checks relative file links only, so CI never flakes on
      # third-party websites.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --include-fragments --exclude-path '\.terraform' '**/*.md'
          fail: true

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
      - name: gitleaks (full history)
        run: gitleaks git --no-banner --redact --verbose .
