version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /terraform/layer1-persistent
      - /terraform/layer1-persistent/bootstrap
      - /terraform/layer2-ephemeral
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      terraform-providers:
        patterns: ["*"]
