apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  labels:
    managed-by: bootstrap-script
    app.kubernetes.io/part-of: argocd-bootstrap
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Platform infrastructure components (ingress, cert-manager, KEDA, etc.)

  # All platform components deploy into this cluster only.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: ingress-nginx
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: keda
    - server: https://kubernetes.default.svc
      namespace: oauth2-proxy
    - server: https://kubernetes.default.svc
      namespace: platform
    - server: https://kubernetes.default.svc
      namespace: kube-system

  # Pin to the gitops repo. Use '*' if additional chart repos are needed
  # (e.g. for Applications that reference external Helm repos as sources).
  sourceRepos:
    - '*'

  # Platform components need full cluster-scope access: installing CRDs,
  # creating Namespaces, creating ClusterRoles, etc.
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

  roles:
    - name: platform-admin
      description: Full administrative access to all platform applications
      policies:
        - p, proj:platform:platform-admin, applications, *, platform/*, allow
        - p, proj:platform:platform-admin, repositories, *, *,           allow
      groups:
        # Replace with the object ID of your AKS Admins AAD group.
        # Terraform output: terraform -chdir=terraform/layer1-persistent output -raw aks_admins_group_object_id
        - <AAD_AKS_ADMINS_GROUP_OBJECT_ID>
