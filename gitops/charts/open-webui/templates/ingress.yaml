{{- if .Values.ingress.enabled }}
# ── App Gateway ingress ────────────────────────────────────────────────────────
# AGIC reads this and programs the App Gateway frontend (TLS, routing rules).
# Backend points to nginx-bridge (headless svc → nginx LB IP 10.1.1.100) so
# AGIC puts a VNet-routable IP in the AGW backend pool rather than pod overlay IPs.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "open-webui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.certIssuer }}
    appgw.ingress.kubernetes.io/request-timeout: "300"
    appgw.ingress.kubernetes.io/ssl-redirect: "false"
    appgw.ingress.kubernetes.io/backend-hostname: {{ (index .Values.ingress.hosts 0).host | quote }}
    appgw.ingress.kubernetes.io/health-probe-path: "/health"
spec:
  ingressClassName: azure-application-gateway
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "open-webui.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
---
# ── nginx ingress ──────────────────────────────────────────────────────────────
# nginx receives the request forwarded from App Gateway and routes to the
# Open WebUI pod. Also handles the cert-manager ACME HTTP-01 solver path
# (cert-manager creates its own solver ingress with nginx class).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "open-webui.fullname" . }}-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "open-webui.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "open-webui.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
