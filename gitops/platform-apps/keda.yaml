apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  labels:
    managed-by: argocd
    app.kubernetes.io/part-of: platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  sources:
    - repoURL: https://kedacore.github.io/charts
      chart: keda
      targetRevision: "2.15.1"
      helm:
        releaseName: keda
        valueFiles:
          - $values/gitops/envs/dev/keda-values.yaml

    - repoURL: https://github.com/engrashid/azure-gpu-aks-ai.git
      ref: values
      targetRevision: main

  destination:
    server: https://kubernetes.default.svc
    namespace: keda

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  # caBundle is injected at runtime by KEDA's admission webhook; ignore to
  # prevent ArgoCD from reporting perpetual drift on ValidatingWebhookConfiguration.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
        - .webhooks[].namespaceSelector.matchExpressions
