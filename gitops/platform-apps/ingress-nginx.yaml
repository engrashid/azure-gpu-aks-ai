apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  labels:
    managed-by: argocd
    app.kubernetes.io/part-of: platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  # Multi-source: upstream Helm chart + gitops repo ref for values.
  # $values resolves to the root of the ref source (targetRevision: main).
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targetRevision: "4.11.3"
      helm:
        releaseName: ingress-nginx
        valueFiles:
          - $values/gitops/envs/dev/ingress-nginx-values.yaml

    - repoURL: https://github.com/engrashid/azure-gpu-aks-ai.git
      ref: values
      targetRevision: main

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
