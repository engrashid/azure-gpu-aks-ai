# Let's Encrypt ClusterIssuers for public-facing certificates.
#
# Two issuers:
#   letsencrypt-staging — use during initial setup; no rate limits; cert is
#                         NOT trusted by browsers (good for testing AGIC flow).
#   letsencrypt-prod    — switch to this once DNS is set and staging works.
#
# HTTP-01 challenge: cert-manager creates a temporary Ingress with
# ingressClass=azure/application-gateway so AGIC routes the ACME path to the
# solver pod. App Gateway must accept inbound HTTP/80 (enforced by NSG rule).
#
# Prerequisites:
#   1. DNS A record: chat.<domain> → App Gateway public IP
#   2. Port 80 open on App Gateway NSG (already added in Terraform)
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    managed-by: argocd
    app.kubernetes.io/part-of: platform
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: azure-application-gateway
            serviceType: NodePort
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    managed-by: argocd
    app.kubernetes.io/part-of: platform
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: azure-application-gateway
            serviceType: NodePort
